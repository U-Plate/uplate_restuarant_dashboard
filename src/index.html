<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>UPlate · Restaurant Dashboard</title>
    <script>
      // GitHub Pages serves 404.html for direct SPA routes. Restore the
      // requested URL before React's BrowserRouter starts routing.
      (function () {
        var redirect = sessionStorage.getItem('uplate-spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('uplate-spa-redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();

      // Set the moss surface before React mounts so unauth'd routes don't
      // flash cream. Toggled by AuthGate after auth state resolves.
      (function () {
        var p = window.location.pathname;
        if (p === '/sign-in' || p === '/sign-up') {
          document.documentElement.setAttribute('data-auth', 'true');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
